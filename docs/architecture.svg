<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Veriflow architecture diagram</title>
  <desc>Flowchart showing Veriflow's control plane: Client to Job API to Postgres, Scheduler claiming jobs from Postgres and dispatching to Kubernetes, with runtime events flowing back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .arr { stroke: #888; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- CLIENT -->
  <rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Client</text>
  <text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">POST /v1/jobs + Idempotency-Key</text>

  <!-- Arrow: Client → Job API -->
  <line x1="340" y1="86" x2="340" y2="126" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- JOB API -->
  <rect x="200" y="126" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Job API (Go)</text>
  <text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Validates, deduplicates, persists job spec</text>

  <!-- Arrow: Job API → Postgres -->
  <line x1="340" y1="182" x2="340" y2="222" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- POSTGRES -->
  <rect x="180" y="222" width="320" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="340" y="247" text-anchor="middle" dominant-baseline="central" fill="#085041">Postgres</text>
  <text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">jobs · runs · events</text>
  <text class="ts" x="340" y="283" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">FOR UPDATE SKIP LOCKED</text>

  <!-- Arrow: Postgres → Scheduler -->
  <path d="M220 292 L220 360 L220 360" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="195" y="350" text-anchor="middle">claim</text>

  <!-- SCHEDULER -->
  <rect x="20" y="340" width="200" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="120" y="365" text-anchor="middle" dominant-baseline="central" fill="#712B13">Scheduler (Go)</text>
  <text class="ts" x="120" y="383" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Priority · GPU-aware</text>
  <text class="ts" x="120" y="399" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Quota · Fairness</text>

  <!-- Arrow: Scheduler → Kubernetes -->
  <line x1="220" y1="375" x2="330" y2="375" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="276" y="367" text-anchor="middle">dispatch</text>

  <!-- KUBERNETES -->
  <rect x="330" y="340" width="200" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="430" y="365" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Kubernetes</text>
  <text class="ts" x="430" y="383" text-anchor="middle" dominant-baseline="central" fill="#185FA5">batch/v1 Job · Pod</text>
  <text class="ts" x="430" y="399" text-anchor="middle" dominant-baseline="central" fill="#185FA5">GPU placement</text>

  <!-- Arrow: reconcile back to Postgres -->
  <path d="M460 340 L460 292" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="494" y="320" text-anchor="start">reconcile</text>

  <!-- Runtime events box -->
  <rect x="30" y="460" width="620" height="130" rx="10" fill="none" stroke="#aaa" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text class="ts" x="46" y="480" dominant-baseline="central">Runtime lifecycle</text>

  <!-- Event pills row 1 -->
  <rect x="46" y="494" width="120" height="28" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="106" y="508" text-anchor="middle" dominant-baseline="central" fill="#444441">JOB_SUBMITTED</text>

  <rect x="178" y="494" width="120" height="28" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="238" y="508" text-anchor="middle" dominant-baseline="central" fill="#3C3489">RUN_CREATED</text>

  <rect x="310" y="494" width="140" height="28" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="380" y="508" text-anchor="middle" dominant-baseline="central" fill="#085041">CHECKPOINT_SAVED</text>

  <rect x="462" y="494" width="110" height="28" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="517" y="508" text-anchor="middle" dominant-baseline="central" fill="#633806">RUN_FAILED</text>

  <!-- Event pills row 2 -->
  <rect x="46" y="534" width="130" height="28" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="ts" x="111" y="548" text-anchor="middle" dominant-baseline="central" fill="#712B13">RETRY_TRIGGERED</text>

  <rect x="188" y="534" width="140" height="28" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="258" y="548" text-anchor="middle" dominant-baseline="central" fill="#0C447C">TRAINING_RESUMED</text>

  <rect x="340" y="534" width="120" height="28" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="ts" x="400" y="548" text-anchor="middle" dominant-baseline="central" fill="#27500A">JOB_SUCCEEDED</text>

  <!-- Arrows into events box -->
  <path d="M430 410 L430 460" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M120 410 L120 460" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
